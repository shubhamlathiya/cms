<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Assignments</title>
</head>
<body>
<h2>Assignments for Division <span th:text="${divisionId}"></span> and Semester <span th:text="${semesterId}"></span></h2>
<a th:href="@{/assignments/{divisionId}/{semesterId}/new(divisionId=${divisionId}, semesterId=${semesterId})}">Add New Assignment</a>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Max Questions</th>
        <th>File Path</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="assignment : ${assignments}">
        <td th:text="${assignment.id}"></td>
        <td th:text="${assignment.maxQuestions}"></td>
        <td th:text="${assignment.filePath}"></td>
        <td>
            <a th:href="@{/assignments/{assignmentId}/assigned-questions(assignmentId=${assignment.id})}">
                View Assigned Questions
            </a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'Register Student'">Register Student</title>
    <link rel="stylesheet" type="text/css" href="/css/styles.css">
</head>
<body>

<!-- Replace the content section -->
<div th:replace="layout/base.html">
    <div th:fragment="content">
        <!--        <main>-->

        <h2>Register New Student</h2>
        <form action="/admin/students/register" method="post">
            <label>Username:</label>
            <input type="text" name="username" required><br>

            <label>Password:</label>
            <input type="password" name="password" required><br>

            <label>First Name:</label>
            <input type="text" name="firstName" required><br>

            <label>Last Name:</label>
            <input type="text" name="lastName" required><br>

            <label>Email:</label>
            <input type="email" name="email" required><br>

            <label>Phone Number:</label>
            <input type="text" name="phoneNumber" required><br>

            <label>Address:</label>
            <input type="text" name="address" required><br>

            <label>Course:</label>
            <select name="course" required>
                <option th:each="course : ${courses}" th:value="${course.courseID}"
                        th:text="${course.courseName}"></option>
            </select><br>


            <button type="submit">Register Student</button>
        </form>

        <hr>

        <h2 class="page-title">Upload Student Data (XLSX)</h2>
        <p class="lead text-muted">Demo for form control styles, layout options, and custom components for creating a
            wide variety of forms.</p>
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card shadow mb-4">
                    <div class="card-header">
                        <strong>Dropzone</strong>
                    </div>
                    <div class="card-body">
                        <form action="/admin/students/upload" class="dropzone bg-light rounded-lg" method="post"
                              enctype="multipart/form-data" id="tinydash-dropzone">
                            <div class="dz-message needsclick">
                                <div class="circle circle-lg bg-primary">
                                    <i class="fe fe-upload fe-24 text-white"></i>
                                </div>
                                <h5 class="text-muted mt-4">Drop files here or click to upload</h5>
                            </div>
                        </form>
                        <div class="d-none" id="uploadPreviewTemplate">
                            <div class="card mt-1 mb-0 shadow-none border">
                                <div class="p-2">
                                    <div class="row align-items-center">
                                        <div class="col-auto">
                                            <img data-dz-thumbnail src="#" class="avatar-sm rounded bg-light" alt="">
                                        </div>
                                        <div class="col pl-0">
                                            <a href="javascript:void(0);" class="text-muted font-weight-bold"
                                               data-dz-name></a>
                                            <p class="mb-0" data-dz-size></p>
                                        </div>
                                        <div class="col-auto">
                                            <!-- Button -->
                                            <a href="" class="btn btn-link btn-lg text-muted" data-dz-remove>
                                                <i class="dripicons-cross"></i>
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div> <!-- .card-body -->
                </div> <!-- .card -->
            </div> <!-- .col -->
        </div>
    </div>

    <!--                <input type="file" name="file" accept=".xlsx" required>-->
    <!--                <button type="submit">Upload and Register</button>-->

</div>
</body>
</html>

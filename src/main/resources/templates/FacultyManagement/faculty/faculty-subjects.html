<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'Faculty Assigned Subjects'">Faculty Assigned Subjects</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>

<!-- Replace the content section -->
<div th:replace="layout/base.html">
    <div th:fragment="content">

        <div class="container mt-5">
            <h2 class="mb-4 page-title">Faculty Assigned Subjects</h2>

            <table class="table table-striped table-bordered">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Faculty Name</th>
                    <th>Designation</th>
                    <th>Department</th>
                    <th>Semester</th>
                    <th>Division</th>
                    <th>Subject Code</th>
                    <th>Subject Name</th>
                    <th>Course</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="assignment : ${assignedSubjects}">
                    <td th:text="${assignment.id}"></td>
                    <td th:text="${assignment.faculty.user.username}"></td>
                    <td th:text="${assignment.faculty.designation}"></td>
                    <td th:text="${assignment.faculty.department.name}"></td>
                    <td th:text="${assignment.semester.name}"></td>
                    <td th:text="${assignment.division.name}"></td>
                    <td th:text="${assignment.subject.subjectCode}"></td>
                    <td th:text="${assignment.subject.subjectName}"></td>
                    <td th:text="${assignment.subject.course.courseName}"></td>
                    <td>
                        <a th:href="@{/attendance/take/{assignmentId}(assignmentId=${assignment.id})}" class="btn btn-info btn-sm">Attendance</a>
                        <a th:href="@{/assignments/{divisionId}/{semesterId}/{subjectId}(divisionId=${assignment.division.id}, semesterId=${assignment.semester.id}, subjectId=${assignment.subject.subjectid})}" class="btn btn-warning btn-sm">Assignment</a>
                    </td>
                </tr>
                </tbody>
            </table>

            <a th:href="@{/faculty/dashboard}" class="btn btn-primary">Back to Dashboard</a>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'Faculty Assigned Subjects'">Faculty Assigned Subjects</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>

<!-- Main Content -->
<div th:replace="layout/base.html">
    <div th:fragment="content">

        <div class="container mt-5">
            <h2 class="mb-4 page-title">Faculty Assigned Subjects</h2>

            <table class="table table-striped table-bordered">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Faculty Name</th>
                    <th>Designation</th>
                    <th>Department</th>
                    <th>Semester</th>
                    <th>Division</th>
                    <th>Subject Code</th>
                    <th>Subject Name</th>
                    <th>Course</th>
                    <th colspan="4">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="assignment : ${assignedSubjects}">
                    <td th:text="${assignment.id}"></td>
                    <td th:text="${assignment.faculty.user.username}"></td>
                    <td th:text="${assignment.faculty.designation}"></td>
                    <td th:text="${assignment.faculty.department.name}"></td>
                    <td th:text="${assignment.semester.name}"></td>
                    <td th:text="${assignment.division.name}"></td>
                    <td th:text="${assignment.subject.subjectCode}"></td>
                    <td th:text="${assignment.subject.subjectName}"></td>
                    <td th:text="${assignment.subject.course.courseName}"></td>
                    <td>
                        <a th:href="@{/attendance/take/{assignmentId}(assignmentId=${assignment.id})}"
                           class="btn btn-info btn-sm">Attendance</a>
                    </td>
                    <td>
                        <a th:href="@{/assignments/{divisionId}/{semesterId}/{subjectId}(divisionId=${assignment.division.id}, semesterId=${assignment.semester.id}, subjectId=${assignment.subject.subjectid})}"
                           class="btn btn-warning btn-sm">Assignment</a>
                    </td>
                    <td>
                        <a th:href="@{/faculty/syllabus/subject/{subjectID}(subjectID=${assignment.subject.subjectid})}"
                           class="btn btn-link btn-sm">View Syllabus</a>
                    </td>
                    <td>
                        <button type="button" class="btn btn-link btn-sm view-students"
                                th:data-division-id="${assignment.division.getId()}">
                            View Students
                        </button>
                    </td>
                </tr>
                </tbody>
            </table>

            <a th:href="@{/faculty/dashboard}" class="btn btn-primary">Back to Dashboard</a>

            <!-- Student List Modal -->
            <div class="modal fade" id="studentModal" tabindex="-1" aria-labelledby="studentModalLabel"
                 aria-hidden="true">
                <div class="modal-dialog modal-lg">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="studentModalLabel">Student List</h5>
                            <button type="button" class="close" data-bs-dismiss="modal" aria-label="Close">
                                <span aria-hidden="true">&times;</span>
                            </button>
                        </div>
                        <div class="modal-body">
                            <table class="table table-bordered table-striped">
                                <thead class="table-dark">
                                <tr>
                                    <th>ID</th>
                                    <th>First Name</th>
                                    <th>Last Name</th>
                                    <th>Email</th>
                                </tr>
                                </thead>
                                <tbody id="studentTable">
                                <!-- Dynamic Student Data Will Be Appended Here -->
                                </tbody>
                            </table>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- jQuery & Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>

<script>
    $(document).on("click", ".view-students", function (e) {
        e.preventDefault();
        var divisionId = $(this).data("division-id");
        console.log(divisionId);
        $.get("/faculty/students/list/" + divisionId, function (students) {
            var tableBody = $('#studentTable');
            tableBody.empty(); // Clear previous data

            if (students.length === 0) {
                tableBody.append('<tr><td colspan="4" class="text-center">No students found</td></tr>');
            } else {
                $.each(students, function (index, student) {
                    tableBody.append('<tr>' +
                        '<td>' + student.id + '</td>' +
                        '<td>' + student.firstName + '</td>' +
                        '<td>' + student.lastName + '</td>' +
                        '<td>' + student.email + '</td>' +
                        '</tr>');
                });
            }

            $("#studentModal").modal("show"); // Show the modal
        }).fail(function () {
            alert("Failed to fetch student data.");
        });
    });
</script>

</body>
</html>

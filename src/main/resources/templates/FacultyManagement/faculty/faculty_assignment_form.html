<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assign Faculty to Subject</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<h2>Assign Faculty to Subject</h2>
<form action="/faculty/assign" method="post">

    <!-- Department Selection -->
    <label>Department:</label>
    <select id="department" name="department.id">
        <option value="">Select Department</option>
        <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.name}"></option>
    </select><br>

    <!-- Course Selection (Filtered by Department) -->
    <label>Course:</label>
    <select id="course" name="course.id">
        <option value="">Select Course</option>
    </select><br>

    <!-- Subject Selection (Filtered by Course) -->
    <label>Subject:</label>
    <select id="subject" name="subject.id">
        <option value="">Select Subject</option>
    </select><br>

    <!-- Faculty Selection (Filtered by Department) -->
    <label>Faculty:</label>
    <select id="faculty" name="faculty.id">
        <option value="">Select Faculty</option>
    </select><br>

    <!-- Semester Selection -->
    <label>Semester:</label>
    <select id="semester" name="semester.id">
        <option value="">Select Semester</option>
        <option th:each="semester : ${semesters}" th:value="${semester.id}" th:text="${semester.name}"></option>
    </select><br>

    <!-- Division Selection (Filtered by Semester) -->
    <label>Division:</label>
    <select id="division" name="division.id">
        <option value="">Select Division</option>
    </select><br>

    <button type="submit">Assign Faculty</button>
</form>

<script>
    $(document).ready(function () {
        // Fetch Courses based on Department
        $('#department').change(function () {
            let departmentId = $(this).val();
            $('#course').html('<option value="">Select Course</option>');
            $('#faculty').html('<option value="">Select Faculty</option>');
            if (departmentId) {
                $.get('/courses/byDepartment/' + departmentId, function (data) {
                    $.each(data, function (index, course) {
                        $('#course').append('<option value="' + course.id + '">' + course.name + '</option>');
                    });
                });

                $.get('/faculty/byDepartment/' + departmentId, function (data) {
                    $.each(data, function (index, faculty) {
                        $('#faculty').append('<option value="' + faculty.facultyId + '">' + faculty.user.username + '</option>');
                    });
                });
            }
        });

        // Fetch Subjects based on Course
        $('#course').change(function () {
            let courseId = $(this).val();
            $('#subject').html('<option value="">Select Subject</option>');
            if (courseId) {
                $.get('/subjects/byCourse/' + courseId, function (data) {
                    $.each(data, function (index, subject) {
                        $('#subject').append('<option value="' + subject.subjectid + '">' + subject.subjectName + '</option>');
                    });
                });
            }
        });

        // Fetch Divisions based on Semester
        $('#semester').change(function () {
            let semesterId = $(this).val();
            $('#division').html('<option value="">Select Division</option>');
            if (semesterId) {
                $.get('/divisions/bySemester/' + semesterId, function (data) {
                    $.each(data, function (index, division) {
                        $('#division').append('<option value="' + division.id + '">' + division.name + '</option>');
                    });
                });
            }
        });
    });
</script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</body>
</html>

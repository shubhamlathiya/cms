<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Faculty</title>
</head>
<body>
<h2>Register New Faculty</h2>
<form action="/faculty/register" method="post">
  <label>Username:</label>
  <input type="text" name="username" required><br>

  <label>Password:</label>
  <input type="password" name="password" required><br>

  <label>First Name:</label>
  <input type="text" name="firstName" required><br>

  <label>Last Name:</label>
  <input type="text" name="lastName" required><br>

  <label>Designation:</label>
  <input type="text" name="designation" required><br>

  <label>Qualification:</label>
  <input type="text" name="qualification" required><br>

  <label>Experience (Years):</label>
  <input type="number" name="experience" required><br>

  <label>Phone Number:</label>
  <input type="text" name="phoneNumber" required><br>

  <label>Email:</label>
  <input type="email" name="email" required><br>

  <label>Status:</label>
  <select name="status" required>
    <option value="Active">Active</option>
    <option value="Inactive">Inactive</option>
  </select><br>

  <label>Department:</label>
  <select name="department" required>
    <option th:each="department : ${departments}" th:value="${department.id}" th:text="${department.name}"></option>
  </select><br>

  <button type="submit">Register Faculty</button>
</form>
</body>
</html>

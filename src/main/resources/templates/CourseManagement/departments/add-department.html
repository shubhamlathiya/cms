<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Add Department</title>
</head>
<body>
<h1>Add Department</h1>
<form th:action="@{/departments/add}" th:object="${department}" method="post">
  <label for="name">Department Name:</label>
  <input type="text" id="name" th:field="*{name}" required>

  <br><br>

  <label for="departmentHead">Head of Department:</label> <!-- New input field for departmentModel head -->
  <input type="text" id="departmentHead" th:field="*{departmentHead}" required>

  <br><br>

  <button type="submit">Add Department</button>
</form>

<br>
<a href="/departments">Back to Departments List</a>
</body>
</html>

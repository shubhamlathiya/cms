<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'Add Department'">Custom Page Title</title>
</head>
<body>

<!-- Replace the content section -->
<div th:replace="layout/base.html">
    <div th:fragment="content">
        <h1>Add Department</h1>
        <form th:action="@{/admin/departments/add}" th:object="${department}" method="post">
            <label for="name">Department Name:</label>
            <input type="text" id="name" th:field="*{name}" required>

            <br><br>

            <label for="departmentHead">Head of Department:</label> <!-- New input field for departmentModel head -->
            <input type="text" id="departmentHead" th:field="*{departmentHead}" required>

            <br><br>

            <button type="submit">Add Department</button>
        </form>

    </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'Update Course'">Custom Page Title</title>
</head>
<body>

<!-- Replace the content section -->
<div th:replace="layout/base.html">
    <div th:fragment="content">
        <h1>Update Course</h1>

        <form th:action="@{/admin/courses/update/{courseID}(courseID=${course.courseID})}" th:object="${course}"
              method="post">
            <label for="name">Course Name:</label>
            <input type="text" id="name" th:field="*{courseName}" required>

            <br><br>

            <label for="duration">Duration:</label>
            <input type="number" id="duration" th:field="*{duration}" required>
            <br><br>

            <label for="departmentModel">Department:</label>
            <select id="departmentModel" th:field="*{department}" required>
                <option th:each="departmentModel : ${departments}"
                        th:value="${departmentModel.id}"
                        th:text="${departmentModel.name}"
                        th:selected="${departmentModel.id == course.department.id}"></option>
            </select>

            <br><br>

            <button type="submit">Update Course</button>
        </form>

    </div>
</div>

</body>
</html>

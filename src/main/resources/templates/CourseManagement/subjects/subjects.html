<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Subjects List</title>
</head>
<body>

<h2>Subjects List</h2>

<!-- Table displaying all subjects -->
<table>
    <thead>
    <tr>
        <th>Subject Code</th>
        <th>Subject Name</th>
        <th>Credits</th>
        <th>Course</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="subject : ${subjects}">
        <td th:text="${subject.subjectCode}"></td>
        <td th:text="${subject.subjectName}"></td>
        <td th:text="${subject.credits}"></td>
        <td th:text="${subject.course.courseName}"></td>
        <td>
            <!-- Edit and Delete actions -->
            <a th:href="@{/subjects/update/{subjectID}(subjectID=${subject.subjectid})}">Edit</a> |
            <a th:href="@{/subjects/delete/{subjectID}(subjectID=${subject.subjectid})}"
               th:onclick="return confirm('Are you sure you want to delete?')">Delete</a>

            <!-- View Syllabus for this Subject -->
            <a th:href="@{/syllabus/subject/{subjectID}(subjectID=${subject.subjectid})}">View Syllabus</a>
        </td>
    </tr>
    </tbody>
</table>

<!-- Link to add a new subject -->
<a href="/subjects/add">Add New Subject</a>

</body>
</html>

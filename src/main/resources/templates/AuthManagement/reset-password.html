<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<form action="/auth/reset-password" method="post">
  <input type="hidden" name="token" th:value="${token}">
  <label>New Password:</label>
  <input type="password" name="password" required>
  <button type="submit">Reset Password</button>
</form>
</body>
</html>

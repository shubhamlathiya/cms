<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'Exam Form'">Exam Form</title>
</head>
<body>

<!-- Replace the content section -->
<div th:replace="layout/base.html">
    <div th:fragment="content">

        <div class="container">
            <h1>Exam Form for Student: <span th:text="${student.firstName} + ' ' + ${student.lastName}"></span></h1>

            <!-- Exam Form Details -->
            <div th:if="${eligibilityMessage != 'Not eligible'}">
                <h2>Exam Form Details</h2>
                <table>
                    <tr>
                        <th>Exam Form Name</th>
                        <td th:text="${examForm.examFormName}"></td>
                    </tr>
                    <tr>
                        <th>Start Date</th>
                        <td th:text="${examForm.startDate}"></td>
                    </tr>
                    <tr>
                        <th>End Date</th>
                        <td th:text="${examForm.endDate}"></td>
                    </tr>
                    <tr>
                        <th>End Date with Late Fee</th>
                        <td th:text="${examForm.endDateWithLateFee}"></td>
                    </tr>
                    <tr>
                        <th>End Date with Super Late Fee</th>
                        <td th:text="${examForm.endDateWithSuperLateFee}"></td>
                    </tr>
                </table>
            </div>

            <!-- Eligibility Status -->
            <div>
                <h3>Eligibility Status</h3>
                <p th:text="${eligibilityMessage}"></p>
            </div>

            <!-- Subjects by Semester -->
            <div th:if="${eligibilityMessage != 'Not eligible'}">
                <h3>Subjects by Semester</h3>
                <div th:each="entry : ${subjectsBySemester}">
                    <h4>Semester: <span th:text="${entry.key}"></span></h4>
                    <ul>
                        <li th:each="subject : ${entry.value}" th:text="${subject.subjectName}"></li>
                    </ul>
                </div>
            </div>

            <!-- Add more content as needed -->
            <div>
                <p>User Role: <span th:text="${userRole}"></span></p>
                <p>Student ID: <span th:text="${studentId}"></span></p>
            </div>
        </div>

    </div>
</div>

</body>
</html>

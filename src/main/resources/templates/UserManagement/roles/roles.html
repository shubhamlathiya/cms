<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Roles</title>

</head>
<body>

<h2>Role Management</h2>

<!-- Add Role Form -->
<form action="/roles/add" method="post">
    <input type="text" name="roleName" placeholder="Enter Role Name" required>
    <button type="submit">Add Role</button>
</form>

<h3>Existing Roles</h3>
<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="role : ${roles}">
        <td th:text="${role.id}"></td>
        <td>
            <form action="/roles/update" method="post">
                <input type="hidden" name="roleId" th:value="${role.id}">
                <input type="text" name="roleName" th:value="${role.name}" required>
                <button type="submit">Update</button>
            </form>
        </td>
        <td>
            <!-- Manage Permissions Button -->
            <a th:href="@{/roles/{id}/permissions(id=${role.id})}">
                <button type="button">Manage Permissions</button>
            </a>

            <!-- Delete Role Form -->
            <form id="deleteForm-[[${role.id}]]" action="/roles/delete" method="post">
                <input type="hidden" name="roleId" th:value="${role.id}">
                <button type="button" onclick="confirmDelete([[${role.id}]])">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
<script>
    function confirmDelete(roleId) {
        if (confirm("Are you sure you want to delete this role?")) {
            document.getElementById('deleteForm-' + roleId).submit();
        }
    }
</script>
</body>
</html>
